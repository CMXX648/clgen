[project]
name = "clgen"
version = "0.1.0"
description = "AI-powered changelog generator CLI tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "KriseZhu" },
]
keywords = ["changelog", "ai", "git", "release-notes", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.9.0",
    "gitpython>=3.1.0",
    "rich>=13.0.0",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/cmxx648/clgen"
Repository = "https://github.com/cmxx648/clgen"
Issues = "https://github.com/cmxx648/clgen/issues"

[project.scripts]
clgen = "clgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
